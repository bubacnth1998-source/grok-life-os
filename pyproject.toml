[project]
name = "grok-life-os"
version = "0.1.0"
description = "Grok LIFE OS — personal operating system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "email-validator>=2.0",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "api.index:app"
