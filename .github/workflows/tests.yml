name: LIFE OS tests

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
    branches:
      - main
      - fix/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js
      - name: Run test suite
        env:
          DATABASE_URL: sqlite:////tmp/grok_life_os_ci.db
          LIFE_OS_SECRET_KEY: ci-only-test-secret-key-change-me-123456
          LIFE_OS_DEBUG: "false"
        run: pytest -q
